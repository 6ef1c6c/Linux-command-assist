name: Extract Device Tree from dtbo.img

on:
  workflow_dispatch:

jobs:
  extract-dtbo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gcc make zlib1g-dev

      - name: Build mkdtimg from affggh/mkdtimg
        run: |
          git clone https://github.com/affggh/mkdtimg.git
          cd mkdtimg
          # 将 Makefile 中的 llvm-strip 替换为 strip
          sed -i 's/llvm-strip/strip/g' Makefile
          make
          sudo cp mkdtimg /usr/local/bin/
          cd ..

      - name: Extract DTB files from dtbo.img
        run: |
          mkdir -p dtb_out
          mkdtimg dump dtbo.img -b dtb_out/

      - name: Decompile DTB to DTS
        run: |
          mkdir -p dts_out
          for dtb in dtb_out/*; do
            base=$(basename "$dtb")
            dtc -I dtb -O dts "$dtb" -o "dts_out/${base}.dts"
          done

      - name: List extracted DTS files
        run: |
          ls -la dts_out/
          echo "---- First DTS content preview (if any) ----"
          head -100 dts_out/*.dts 2>/dev/null || echo "No DTS files generated"

      - name: Upload DTS files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-device-trees
          path: dts_out/*.dts
