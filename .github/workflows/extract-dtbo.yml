name: Extract Device Tree from dtbo.img

on:
  workflow_dispatch:

jobs:
  extract-dtbo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y device-tree-compiler

      - name: Check dtbo.img magic
        run: |
          file dtbo.img
          hexdump -C dtbo.img | head -5

      - name: Try to decompile with dtc (will fail for DTBO)
        continue-on-error: true
        run: dtc -I dtb -O dts dtbo.img -o extracted.dts || echo "dtc failed, dtbo.img is likely a DTBO container"

      - name: Fallback to mkdtimg (if needed)
        run: |
          # 这里可以添加从预编译二进制下载 mkdtimg 的逻辑，但为了简洁，不实现
          echo "Please extract locally using mkdtimg"
          exit 1
