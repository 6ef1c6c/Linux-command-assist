name: Extract Device Tree from dtbo.img

on:
  workflow_dispatch:

jobs:
  extract-dtbo:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y device-tree-compiler

      - name: Verify dtbo.img exists
        run: |
          ls -la
          test -f dtbo.img || (echo "ERROR: dtbo.img not found" && exit 1)

      - name: Decompile dtbo.img to DTS
        run: dtc -I dtb -O dts dtbo.img -o extracted.dts

      - name: Upload DTS file
        uses: actions/upload-artifact@v4
        with:
          name: extracted-device-tree
          path: extracted.dts
