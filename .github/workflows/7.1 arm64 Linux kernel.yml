name: Build ARM64 Linux Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex bison \
            libssl-dev libelf-dev \
            bc cpio \
            wget xz-utils \
            git \
            gcc-aarch64-linux-gnu  # 必须安装 ARM64 交叉编译器

      - name: Download kernel source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.tar.xz
          tar -xvf linux-7.1.tar.xz
          mv linux-7.1 linux

      - name: Copy kernel config
        run: |
          cp ${{ github.workspace }}/.config linux/.config

      - name: Build kernel (Image & dtbs)
        run: |
          cd linux
          
          # 【关键】在执行任何 make 前，先声明环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 处理旧配置文件（此时已应用上述环境变量）
          yes '' | make olddefconfig
          
          # 编译内核镜像和设备树
          make -j$(nproc) Image dtbs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: |
            linux/arch/arm64/boot/Image
            linux/arch/arm64/boot/dts/
