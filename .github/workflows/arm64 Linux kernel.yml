name: Build ARM64 Linux Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: 'Kernel source tarball URL'
        required: true
        default: ''

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex bison \
            libssl-dev libelf-dev \
            bc cpio \
            wget xz-utils \
            git \
            gcc-aarch64-linux-gnu

      - name: Download kernel source
        run: |
          wget -O kernel.tar.xz ${{ github.event.inputs.kernel_url }}
          tar -xvf kernel.tar.xz
          mv linux-* linux

      - name: Copy kernel config
        run: |
          cp ${{ github.workspace }}/.config linux/.config

      - name: Build kernel (Image & dtbs)
        run: |
          cd linux
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          yes '' | make olddefconfig
          make -j$(nproc) Image

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: |
            linux/arch/arm64/boot/Image
