name: Build eza (ARM64 Static)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for aarch64 (cross)
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 获取最新版本号
        id: get_version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/eza-community/eza/releases/latest | jq -r .tag_name)
          echo "version=${LATEST#v}" >> $GITHUB_OUTPUT

      - name: 🦀 安装 Rust 工具链
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-musl
          override: true

      - name: 🔨 交叉编译静态 eza
        run: |
          cargo install eza \
            --version ${{ steps.get_version.outputs.version }} \
            --target aarch64-unknown-linux-musl \
            --features vendored-openssl,git \
            --root ./eza-install

      - name: 📦 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: eza-aarch64-static
          path: ./eza-install/bin/eza
