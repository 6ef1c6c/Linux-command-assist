name: Build eza (ARM64 Static)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone eza and get latest tag
        run: |
          git clone https://github.com/eza-community/eza.git
          cd eza
          LATEST_TAG=$(curl -s https://api.github.com/repos/eza-community/eza/releases/latest | jq -r .tag_name)
          git checkout $LATEST_TAG
          echo "EZA_VERSION=${LATEST_TAG#v}" >> $GITHUB_ENV

      - name: Install Rust and cross
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo install cross

      - name: Build eza statically for aarch64 using cross
        run: |
          cd eza
          cross build --target aarch64-unknown-linux-musl --release --features vendored-openssl,git

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eza-aarch64-static
          path: eza/target/aarch64-unknown-linux-musl/release/eza
