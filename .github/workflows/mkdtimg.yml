name: Build mkdtimg (Full Static, No ACPI, Clang/LLD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git clang lld zlib1g-dev

      - name: Clone official libufdt
        run: |
          cd $HOME
          git clone https://android.googlesource.com/platform/system/libufdt

      - name: Remove ACPI dependency from source (comment out libacpi.h includes)
        run: |
          cd $HOME/libufdt/utils/src
          find . -name "*.c" -exec sed -i 's/#include "libacpi.h"/\/\/ &/g' {} \;

      - name: Compile object files (clang)
        run: |
          cd $HOME/libufdt/utils/src
          clang -c *.c -I../../include

      - name: Link statically (lld)
        run: |
          cd $HOME/libufdt/utils/src
          clang -static -fuse-ld=lld -o mkdtimg *.o -lz -lm

      - name: Verify binary
        run: |
          cd $HOME/libufdt/utils/src
          file mkdtimg
          ldd mkdtimg || echo "Statically linked (no dynamic dependencies)"
          ./mkdtimg help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdtimg-static-noacpi
          path: $HOME/libufdt/utils/src/mkdtimg
