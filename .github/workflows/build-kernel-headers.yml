name: Build Kernel Headers (ARM64)

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: 'Kernel source tarball URL'
        required: false
        default: 'https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.tar.xz'
      kernel_version:
        description: 'Kernel version (for artifact naming)'
        required: false
        default: '7.1'

jobs:
  build-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev bc rsync

      - name: Download kernel source
        run: |
          wget -O kernel.tar.xz ${{ github.event.inputs.kernel_url || 'https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.tar.xz' }}
          tar -xJf kernel.tar.xz
          # 解压后的目录名可能是 linux-<version>，重命名为 linux-source 方便处理
          mv linux-* linux-source

      - name: Export headers
        run: |
          cd linux-source
          make headers_install ARCH=arm64 INSTALL_HDR_PATH=./headers

      - name: Package headers
        run: |
          cd linux-source/headers
          tar -czf ../../kernel-headers-arm64.tar.gz .
          cd ../..

      - name: Upload headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-headers-arm64-${{ github.event.inputs.kernel_version || '7.1' }}
          path: kernel-headers-arm64.tar.gz
